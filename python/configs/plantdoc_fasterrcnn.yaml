# 对照模型；不是默认手机部署模型。
model: fasterrcnn_mobilenet_v3_large_320_fpn
pretrained: true
image_root: data/plantdoc/raw
annotation_dir: data/plantdoc/annotations
run_dir: runs/plantdoc_fasterrcnn
device: auto
cpu_threads: 4
seed: 42
epochs: 20
batch_size: 2
num_workers: 0
lr: 0.005
weight_decay: 0.0005
lr_step: 10
freeze_backbone_epochs: 2
freeze_bn: true
amp: true
