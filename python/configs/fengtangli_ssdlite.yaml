# 需要自采图片、专家确认类别以及位置标注，准备数据后再训练。
model: ssdlite320_mobilenet_v3_large
dataset: fengtangli
pretrained: true
image_root: data/fengtangli/raw
annotation_dir: data/fengtangli/annotations
run_dir: runs/fengtangli_ssdlite
device: auto
cpu_threads: 4
seed: 42
epochs: 30
batch_size: 4
num_workers: 0
lr: 0.005
weight_decay: 0.0005
lr_step: 15
freeze_backbone_epochs: 2
freeze_bn: true
amp: true
