# 练习用 PlantDoc，不能当作蜂糖李识别模型。
model: ssdlite320_mobilenet_v3_large
dataset: plantdoc
pretrained: true
image_root: data/plantdoc/raw
annotation_dir: data/plantdoc/annotations
run_dir: runs/plantdoc_ssdlite
device: auto
cpu_threads: 4
seed: 42
epochs: 20
batch_size: 4
num_workers: 0
lr: 0.005
weight_decay: 0.0005
lr_step: 10
freeze_backbone_epochs: 2
freeze_bn: true
amp: true
